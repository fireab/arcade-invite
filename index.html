<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title> Batch Third Flash Ceremony</title>
  <!-- Google Fonts for Retro Arcade Look -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Screens (Overlays) -->

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
      <!-- <div class="et-brand">✈ ETHIOPIAN AIRLINES AVIATION ACADEMY ✈</div> -->
      <h1>BATCH 63<br><span class="neon-text">FLASH CEREMONY</span></h1>
      <p>Aviation Training Journey</p>
      <button id="btn-start" class="arcade-btn">CLICK TO START</button>
      <!-- <div class="instructions">Use ARROW KEYS, A/D or DRAG to move left/right. Catch the objects!</div> -->
    </div>

    <!-- HUD (Heads Up Display) -->
    <div id="hud" class="screen">
      <div class="hud-top">
        <div id="stage-display" style="width:100%; text-align:center;">CURRENT: GROUND CLASS</div>
      </div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
      <h1 class="red-neon">GAME OVER</h1>
      <p id="final-stage">MISSED: Ground Class</p>
      <p>TRY AGAIN PILOT!</p>
      <button id="btn-restart" class="arcade-btn">RESTART GAME</button>
    </div>

    <!-- Victory / Invitation Screen -->
    <div id="victory-screen" class="screen">
      <div class="invitation-card" style="padding: 10px; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; box-sizing: border-box;">
        <img src="./invitation.jpg" alt="Invitation Ceremony" style="max-width: 100%; max-height: 80vh; object-fit: contain; border: 2px solid #D4AF37; border-radius: 10px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); margin-bottom: 20px;">
        <button id="btn-screenshot" class="arcade-btn screenshot-btn">📸 SAVE INVITATION</button>
      </div>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>

</html>
